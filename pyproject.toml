[project]
name = "reverse-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Batreme", email = "qkiritop@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.1",
    "playwright>=1.64.1",
    "pydantic>=2.14.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlite-vec>=0.1.9",
    "typer>=0.27.3",
]

[project.scripts]
reverse-harness = "reverse_harness:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
